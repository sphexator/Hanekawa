services:
  hanekawa.bot:
    image: hanekawa.bot
    build:
      context: .
      dockerfile: Hanekawa.Bot/Dockerfile
  postgres:
    image: postgres:latest
    container_name: hanekawa-postgres
    environment:
      POSTGRES_DB: hanekawa
      POSTGRES_USER: hanekawa
      POSTGRES_PASSWORD: hanekawa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: hanekawa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: